openapi: 3.0.3
info:
  title: UCRP — Unified Retail Customer Platform for Shopping Centers
  version: 1.0.0
  description: |-
    REST API specification for the shopping center unified guest profile platform (case #2). Source of truth for paths and methods — `design/endpoint-registry.md` (104 endpoints); for data structure — `design/05-er-data-model.md` (E-1…E-21).

    Conventions:
    * Base prefix — `/api/v1`; `/healthz` is outside the prefix.
    * Format — JSON, UTF-8; time in UTC (RFC 3339); money — integer minor units (`amountMinor`, 35000 = 350.00 RUB).
    * JSON field names — `camelCase`; query parameter names keep the registry notation (`snake_case`).
    * Authentication — `Authorization: Bearer <JWT access>` (TTL 15 min), refresh — httpOnly cookie. Role and `tenantId` come from the token claims.
    * Roles: `R-1` Management company marketer, `R-2` Manager, `R-3` Tenant, `R-4` Analyst, `R-6` System (does not use REST). `R-5` Guest has no access.
    * R-3 isolation: `tenantId` comes only from the claims; a mismatch with the path/request → 403 `forbidden_tenant`; the repository always applies `WHERE tenant_id = :claimTenant`.
    * Unified error format: `{"error":{"code","message","details":[{"field","reason"}],"request_id"}}`.
    * Check order: 401 (authentication) → 403 (role) → 400 (validation) → 403 (foreign tenant) → 404 → 409.
    * Timeout budget: request 30 s, segment preview 10 s, synchronous export 25 s, connector external HTTP 30 s; exceeding → 504 `timeout`.
    * The `x-roles` and `x-uc` extensions link an operation to the role registry and use cases.
  contact:
    name: UCRP API Team
  license:
    name: Proprietary
    url: https://ucrp.local/license
servers:
  - url: /
    description: Current host
tags:
  - name: Auth
    description: Authentication and the current user (UC-16)
  - name: Users
    description: Platform user management (UC-18)
  - name: Reference
    description: 'Reference data: tenants, categories, projects, event types, source types and instances (UC-17)'
  - name: Imports
    description: File uploads, statuses, rejected rows, manual sync (UC-1, UC-14)
  - name: Guests
    description: Unified guest profile, event feed, contacts, recommendations (UC-2, UC-4)
  - name: Identity
    description: Disputed merge queue, profile merge and split, merge blocks (UC-11, UC-12)
  - name: Segments
    description: No-code segment builder, rule versions, membership, recompute (UC-3, UC-13)
  - name: Campaigns
    description: Campaigns and effect measurement (UC-20)
  - name: Exports
    description: Segment export to a channel, control group, contact limits (UC-5, UC-10)
  - name: Analytics
    description: Manager dashboards, tenant aggregates, data quality (UC-7, UC-8, UC-9)
  - name: Audit
    description: Audit log (UC-19)
  - name: System
    description: Service endpoints
security:
  - bearerAuth: []
