Tenant:
  type: object
  required:
    - id
    - code
    - name
    - mallId
    - categoryId
    - floor
    - priority
    - isActive
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
    code:
      type: string
      maxLength: 64
    name:
      type: string
      maxLength: 200
    mallId:
      type: string
      description: Mall the tenant belongs to
    categoryId:
      type: string
    categoryName:
      type: string
      readOnly: true
    floor:
      type: integer
      nullable: true
      description: Mall floor; null means the tenant has no floor and cannot be used as a zone
    areaSqm:
      type: number
      format: double
      nullable: true
    xM:
      type: number
      format: double
      nullable: true
      description: X coordinate on the floor plan, meters
    yM:
      type: number
      format: double
      nullable: true
      description: Y coordinate on the floor plan, meters
    priority:
      type: integer
      minimum: 0
      maximum: 100
      description: Tenant priority in recommendation scoring
    isActive:
      type: boolean
    deletedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
TenantOwnReference:
  type: object
  description: Own tenant reference visible to an authorized tenant; internal priority is not included.
  required:
    - id
    - code
    - name
    - categoryId
    - kind
    - floor
    - isActive
  additionalProperties: false
  properties:
    id:
      type: string
    code:
      type: string
    name:
      type: string
    categoryId:
      type: string
    kind:
      type: string
    floor:
      type: integer
      nullable: true
    isActive:
      type: boolean
TenantOwnReferencePage:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      maxItems: 1
      items:
        $ref: ./reference-tenants.yaml#/TenantOwnReference
TenantCreateRequest:
  type: object
  required:
    - code
    - name
    - mallId
    - categoryId
    - floor
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 64
    name:
      type: string
      minLength: 1
      maxLength: 200
    mallId:
      type: string
    categoryId:
      type: string
    floor:
      type: integer
      nullable: true
    areaSqm:
      type: number
      format: double
      nullable: true
    xM:
      type: number
      format: double
      nullable: true
    yM:
      type: number
      format: double
      nullable: true
    priority:
      type: integer
      minimum: 0
      maximum: 100
      default: 50
    isActive:
      type: boolean
      default: true
TenantUpdateRequest:
  type: object
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 64
    name:
      type: string
      minLength: 1
      maxLength: 200
    mallId:
      type: string
    categoryId:
      type: string
    floor:
      type: integer
      nullable: true
    areaSqm:
      type: number
      format: double
      nullable: true
    xM:
      type: number
      format: double
      nullable: true
    yM:
      type: number
      format: double
      nullable: true
    priority:
      type: integer
      minimum: 0
      maximum: 100
    isActive:
      type: boolean
TenantListItem:
  description: Tenant with period statistics and source counts. `guestsCount`, `visitsCount` and `newGuestsCount` are null without the matching metric permission, and null with `suppressed` true when fewer than k distinct guests stand behind them.
  allOf:
    - $ref: ./reference-tenants.yaml#/Tenant
    - type: object
      required:
        - sourcesCount
        - problemSourcesCount
        - suppressed
      properties:
        guestsCount:
          type: integer
          nullable: true
          description: Distinct guests with a presence event in the period; requires metric.visits_count.read
        visitsCount:
          type: integer
          nullable: true
          description: Presence events in the period; requires metric.visits_count.read
        newGuestsCount:
          type: integer
          nullable: true
          description: Guests whose first presence event at this tenant falls in the period; requires metric.new_guests_via_mall.read
        suppressed:
          type: boolean
        sourcesCount:
          type: integer
          minimum: 0
        problemSourcesCount:
          type: integer
          minimum: 0
          description: Sources whose latest import failed or finished with errors
TenantPage:
  type: object
  required:
    - items
    - meta
  properties:
    items:
      type: array
      items:
        $ref: ./reference-tenants.yaml#/TenantListItem
    meta:
      $ref: ./common.yaml#/PageMeta
