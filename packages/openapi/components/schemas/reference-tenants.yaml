Tenant:
  type: object
  required:
    - id
    - code
    - name
    - categoryId
    - floor
    - priority
    - isActive
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
    code:
      type: string
      maxLength: 64
    name:
      type: string
      maxLength: 200
    categoryId:
      type: string
    categoryName:
      type: string
      readOnly: true
    floor:
      type: integer
      description: Complex floor
    areaSqm:
      type: number
      format: double
      nullable: true
    xM:
      type: number
      format: double
      nullable: true
      description: X coordinate on the floor plan, meters
    yM:
      type: number
      format: double
      nullable: true
      description: Y coordinate on the floor plan, meters
    priority:
      type: integer
      minimum: 0
      maximum: 100
      description: Tenant priority in recommendation scoring
    isActive:
      type: boolean
    deletedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
TenantOwnReference:
  type: object
  description: Own tenant reference visible to an authorized tenant; internal priority is not included.
  required:
    - id
    - code
    - name
    - categoryId
    - kind
    - floor
    - isActive
  additionalProperties: false
  properties:
    id:
      type: string
    code:
      type: string
    name:
      type: string
    categoryId:
      type: string
    kind:
      type: string
    floor:
      type: integer
    isActive:
      type: boolean
TenantOwnReferencePage:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      maxItems: 1
      items:
        $ref: ./reference-tenants.yaml#/TenantOwnReference
TenantCreateRequest:
  type: object
  required:
    - code
    - name
    - categoryId
    - floor
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 64
    name:
      type: string
      minLength: 1
      maxLength: 200
    categoryId:
      type: string
    floor:
      type: integer
    areaSqm:
      type: number
      format: double
      nullable: true
    xM:
      type: number
      format: double
      nullable: true
    yM:
      type: number
      format: double
      nullable: true
    priority:
      type: integer
      minimum: 0
      maximum: 100
      default: 50
    isActive:
      type: boolean
      default: true
TenantUpdateRequest:
  type: object
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 64
    name:
      type: string
      minLength: 1
      maxLength: 200
    categoryId:
      type: string
    floor:
      type: integer
    areaSqm:
      type: number
      format: double
      nullable: true
    xM:
      type: number
      format: double
      nullable: true
    yM:
      type: number
      format: double
      nullable: true
    priority:
      type: integer
      minimum: 0
      maximum: 100
    isActive:
      type: boolean
TenantPage:
  type: object
  required:
    - items
    - meta
  properties:
    items:
      type: array
      items:
        $ref: ./reference-tenants.yaml#/Tenant
    meta:
      $ref: ./common.yaml#/PageMeta
