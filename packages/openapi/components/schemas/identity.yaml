MergeResolution:
  type: string
  enum:
    - pending
    - confirmed
    - rejected
    - auto_merged
    - reverted
MergeCandidate:
  type: object
  required:
    - id
    - guestAId
    - guestBId
    - reasonCode
    - score
    - resolution
    - createdAt
  properties:
    id:
      type: string
    guestAId:
      type: string
      description: Smaller identifier of the pair (canonical order)
    guestBId:
      type: string
    reasonCode:
      type: string
      example: shared_phone_names_differ
      description: Match reason code
    reasonText:
      type: string
      description: Reason
    score:
      type: integer
      minimum: 0
      maximum: 100
      description: Merge confidence score
    resolution:
      $ref: ./identity.yaml#/MergeResolution
    winnerGuestId:
      type: string
      nullable: true
    mergedGuestId:
      type: string
      nullable: true
    decidedBy:
      type: string
      nullable: true
    decidedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
MergeCandidateDetail:
  allOf:
    - $ref: ./identity.yaml#/MergeCandidate
    - type: object
      required:
        - guestA
        - guestB
        - sharedKeys
      properties:
        guestA:
          $ref: ./guests.yaml#/GuestProfile
        guestB:
          $ref: ./guests.yaml#/GuestProfile
        sharedKeys:
          type: array
          description: Matching normalized keys
          items:
            type: object
            properties:
              idType:
                $ref: ./guests.yaml#/IdentifierType
              valueNormalized:
                type: string
        differingFields:
          type: array
          description: Differing attributes (for example, displayName)
          items:
            type: string
MergeCandidatePage:
  type: object
  required:
    - items
    - meta
  properties:
    items:
      type: array
      items:
        $ref: ./identity.yaml#/MergeCandidate
    meta:
      $ref: ./common.yaml#/PageMeta
MergeRequest:
  type: object
  required:
    - targetGuestId
  properties:
    targetGuestId:
      type: string
      description: Winning profile that the guest from the path is merged into
MergeResult:
  type: object
  required:
    - winnerGuestId
    - mergedGuestId
    - eventsMoved
    - identifiersMoved
  properties:
    candidateId:
      type: string
      nullable: true
    winnerGuestId:
      type: string
    mergedGuestId:
      type: string
    eventsMoved:
      type: integer
      minimum: 0
    identifiersMoved:
      type: integer
      minimum: 0
    auditLogId:
      type: string
MergeBlock:
  type: object
  required:
    - id
    - guestAId
    - guestBId
    - reason
    - createdAt
  properties:
    id:
      type: string
    guestAId:
      type: string
    guestBId:
      type: string
    reason:
      type: string
      enum:
        - manual_unmerge
        - manual_reject
        - auto_conflict
      description: Reason for the merge block
    candidateId:
      type: string
      nullable: true
    createdBy:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
MergeBlockPage:
  type: object
  required:
    - items
    - meta
  properties:
    items:
      type: array
      items:
        $ref: ./identity.yaml#/MergeBlock
    meta:
      $ref: ./common.yaml#/PageMeta
