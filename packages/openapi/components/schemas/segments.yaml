SegmentStatus:
  type: string
  enum:
    - pending
    - computing
    - ready
    - failed
    - archived
SegmentRule:
  type: object
  description: Segment rule (JSON DSL). Compiled into parameterized SQL, so arbitrary queries are impossible.
  required:
    - periodDays
  properties:
    visitedTenantIds:
      type: array
      description: Guest had an event at any of these tenants
      items:
        type: string
    excludedTenantIds:
      type: array
      description: Guest had no events at any of these tenants
      items:
        type: string
    visitedCategoryIds:
      type: array
      description: Guest visited a tenant in the category
      items:
        type: string
    excludedCategoryIds:
      type: array
      items:
        type: string
    periodDays:
      type: integer
      minimum: 1
      maximum: 730
      description: Analysis window in days
    requireContact:
      type: string
      nullable: true
      enum:
        - phone
        - email
      description: Require a contact of the given type
    minVisits:
      type: integer
      minimum: 1
      nullable: true
    minAmountMinor:
      type: integer
      format: int64
      minimum: 0
      nullable: true
SegmentRuleNode:
  description: 'A rule tree node: either a flat `SegmentRule` or a `SegmentRuleGroup`. A node with `operator` and `conditions` is a group; otherwise it is a flat rule. Existing flat rules remain valid unchanged.'
  oneOf:
    - $ref: ./segments.yaml#/SegmentRule
    - $ref: ./segments.yaml#/SegmentRuleGroup
SegmentRuleGroup:
  type: object
  description: 'Nested group of rule nodes combined with a logical operator. `and`: a guest must match every condition; `or`: a guest must match at least one. Groups may be nested to any depth the server accepts. Each flat condition keeps its own `periodDays` window.'
  required:
    - operator
    - conditions
  properties:
    operator:
      type: string
      enum:
        - and
        - or
    conditions:
      type: array
      minItems: 1
      items:
        $ref: ./segments.yaml#/SegmentRuleNode
SegmentVersion:
  type: object
  required:
    - id
    - segmentId
    - versionNo
    - rule
    - status
    - memberCount
    - suppressed
  properties:
    id:
      type: string
    segmentId:
      type: string
    versionNo:
      type: integer
      minimum: 1
    rule:
      $ref: ./segments.yaml#/SegmentRuleNode
    ruleText:
      type: string
      description: Rule in business language
    status:
      $ref: ./segments.yaml#/SegmentStatus
    memberCount:
      type: integer
      minimum: 0
      nullable: true
      description: Null when unknown or fewer than five guests.
    suppressed:
      type: boolean
    computedAt:
      type: string
      format: date-time
      nullable: true
    createdBy:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
Segment:
  type: object
  required:
    - id
    - name
    - isTemplate
    - currentVersionNo
    - status
    - memberCount
    - suppressed
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
    name:
      type: string
      maxLength: 200
    description:
      type: string
      nullable: true
    templateCode:
      type: string
      nullable: true
      example: sleeping_neighbor
    isTemplate:
      type: boolean
    currentVersionNo:
      type: integer
      minimum: 1
    status:
      $ref: ./segments.yaml#/SegmentStatus
    memberCount:
      type: integer
      minimum: 0
      nullable: true
      description: Null when unknown or fewer than five guests.
    suppressed:
      type: boolean
    computedAt:
      type: string
      format: date-time
      nullable: true
    rule:
      $ref: ./segments.yaml#/SegmentRuleNode
    ruleText:
      type: string
    createdBy:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
