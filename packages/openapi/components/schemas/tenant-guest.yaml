TenantGuestIdentifier:
  type: object
  required:
    - id
    - guestId
    - idType
    - valueNormalized
    - createdAt
  properties:
    id:
      type: string
    guestId:
      type: string
    idType:
      type: string
    valueNormalized:
      type: string
    createdAt:
      type: string
      format: date-time
TenantGuestProfile:
  type: object
  required:
    - id
    - displayName
    - status
    - firstSeenAt
    - identifiers
    - tenants
    - segments
  properties:
    id:
      type: string
    displayName:
      type: string
      nullable: true
      description: 'Always null: no tenant-specific name provenance is recorded.'
    status:
      type: string
      enum:
        - active
    firstSeenAt:
      type: string
      format: date-time
    identifiers:
      type: array
      items:
        $ref: ./tenant-guest.yaml#/TenantGuestIdentifier
    tenants:
      type: array
      items:
        type: string
      maxItems: 0
    segments:
      type: array
      items:
        type: string
      maxItems: 0
TenantGuestEvent:
  type: object
  required:
    - id
    - eventTypeId
    - tenantId
    - projectId
    - externalId
    - occurredAt
    - amountMinor
    - currency
  properties:
    id:
      type: string
    eventTypeId:
      type: string
    tenantId:
      type: string
    projectId:
      type: string
      nullable: true
    externalId:
      type: string
      nullable: true
    occurredAt:
      type: string
      format: date-time
    amountMinor:
      type: integer
      format: int64
      nullable: true
    currency:
      type: string
      nullable: true
TenantGuestEvents:
  type: object
  required:
    - items
  properties:
    items:
      type: array
      items:
        $ref: ./tenant-guest.yaml#/TenantGuestEvent
EmptyTenantAggregate:
  type: object
  maxProperties: 0
  description: No metric permission granted.
TenantAggregateDay:
  type: object
  required:
    - date
    - visitsCount
  properties:
    date:
      type: string
      format: date
    visitsCount:
      type: integer
      nullable: true
      description: null when fewer than k distinct guests visited on that day
    newGuestsCount:
      type: integer
      nullable: true
      description: Requires metric.new_guests_via_mall.read; null without it or when below k
    repeatVisitsCount:
      type: integer
      nullable: true
      description: Requires metric.repeat_visits.read; null without it or when fewer than k distinct guests made a repeat visit that day
    revenueTotalMinor:
      type: integer
      format: int64
      nullable: true
      description: Requires metric.revenue_total.read; null without it or when fewer than k distinct guests made a purchase that day
ManagementTenantAggregate:
  type: object
  description: Tenant aggregates. `visitsCount` requires metric.visits_count.read; `guestsCount` follows `visitsCount`; every other value requires its own metric permission (named in the field description) and is null without it, including its per-day value in `series`. A value is null when fewer than k distinct guests stand behind it; money amounts are suppressed the same way. A purchase is an event of type `purchase` with an amount; amounts are in minor units. `series` covers the requested period day by day and is empty when no period is requested.
  required:
    - visitsCount
    - suppressed
    - suppressionThreshold
    - series
  properties:
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    visitsCount:
      type: integer
      nullable: true
    guestsCount:
      type: integer
      nullable: true
      description: Distinct guests with a presence event in the period
    newGuestsCount:
      type: integer
      nullable: true
      description: Guests whose first presence event at this tenant falls in the period
    repeatVisitsCount:
      type: integer
      nullable: true
      description: Requires metric.repeat_visits.read. Presence events in the period by guests who already had an earlier presence event at this tenant; k applies to the distinct guests behind them
    revenueTotalMinor:
      type: integer
      format: int64
      nullable: true
      description: Requires metric.revenue_total.read. Sum of purchase amounts in the period; k applies to the distinct purchasing guests
    avgCheckMinor:
      type: integer
      format: int64
      nullable: true
      description: Requires metric.avg_check.read. Revenue divided by the number of purchases in the period, rounded; k applies to the distinct purchasing guests
    firstPurchasesCount:
      type: integer
      nullable: true
      description: Requires metric.first_purchase_new_tenant.read. Guests whose first purchase at this tenant falls in the period and who had no earlier event of any type at this tenant
    suppressed:
      type: boolean
    suppressionThreshold:
      type: integer
    series:
      type: array
      items:
        $ref: ./tenant-guest.yaml#/TenantAggregateDay
