Mall:
  type: object
  required:
    - id
    - code
    - name
    - isActive
    - floors
  properties:
    id:
      type: string
    code:
      type: string
      maxLength: 64
    name:
      type: string
      maxLength: 200
    isActive:
      type: boolean
    floors:
      type: array
      readOnly: true
      description: Distinct non-zero floors of the mall's active tenants, ascending. A zone is a pair of a mall and one of these floors.
      items:
        type: integer
MallCreateRequest:
  type: object
  required:
    - code
    - name
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 64
    name:
      type: string
      minLength: 1
      maxLength: 200
MallUpdateRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    isActive:
      type: boolean
