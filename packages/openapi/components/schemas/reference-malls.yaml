Mall:
  type: object
  required:
    - id
    - code
    - name
    - isActive
    - floorMin
    - floorMax
    - hasZeroFloor
    - floors
  properties:
    id:
      type: string
    code:
      type: string
      maxLength: 64
    name:
      type: string
      maxLength: 200
    isActive:
      type: boolean
    floorMin:
      type: integer
      description: Lowest floor of the mall, may be negative.
    floorMax:
      type: integer
      description: Highest floor of the mall.
    hasZeroFloor:
      type: boolean
      description: Whether floor 0 is a real floor of the mall. Otherwise 0 is skipped in the range.
    floors:
      type: array
      readOnly: true
      description: Floors from floorMin to floorMax, ascending, with 0 included only when hasZeroFloor is set. A zone is a pair of a mall and one of these floors.
      items:
        type: integer
MallCreateRequest:
  type: object
  required:
    - code
    - name
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 64
    name:
      type: string
      minLength: 1
      maxLength: 200
    floorMin:
      type: integer
      default: 1
    floorMax:
      type: integer
      default: 1
    hasZeroFloor:
      type: boolean
      default: false
MallUpdateRequest:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    isActive:
      type: boolean
    floorMin:
      type: integer
    floorMax:
      type: integer
    hasZeroFloor:
      type: boolean
