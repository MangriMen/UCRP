paths:
  /api/v1/access/permissions:
    get:
      tags:
        - Access
      operationId: listAccessPermissions
      summary: List active permissions
      x-roles:
        - R-2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/access-results.yaml#/Permission
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
  /api/v1/access/presets:
    get:
      tags:
        - Access
      operationId: listAccessPresets
      summary: List tenant access presets
      x-roles:
        - R-2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/access-results.yaml#/Preset
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
  /api/v1/access/effective:
    get:
      tags:
        - Access
      operationId: getEffectiveAccess
      summary: View effective access of a tenant subject or manager user
      x-roles:
        - R-2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: ../components/schemas/access-results.yaml#/SubjectPermissions
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
      parameters:
        - name: subject_type
          in: query
          required: true
          schema:
            type: string
        - name: subject_id
          in: query
          required: true
          schema:
            type: string
  /api/v1/access/simulate:
    post:
      tags:
        - Access
      operationId: simulateAccess
      summary: Simulate a grant without saving it
      x-roles:
        - R-2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: ../components/schemas/access-results.yaml#/SubjectPermissions
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/access.yaml#/GrantRequest
  /api/v1/access/audit:
    get:
      tags:
        - Access
      operationId: listAccessAudit
      summary: List access audit events
      x-roles:
        - R-2
        - R-4
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../components/schemas/access-results.yaml#/AuditEntry
                  meta:
                    $ref: ../components/schemas/common.yaml#/PageMeta
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
      parameters:
        - $ref: ../components/parameters.yaml#/Page
        - $ref: ../components/parameters.yaml#/PageSize
        - name: grant_id
          in: query
          required: false
          schema:
            type: string
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
