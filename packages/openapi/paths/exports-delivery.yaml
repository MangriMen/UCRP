paths:
  /api/v1/exports/{id}/members:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    get:
      tags:
        - Exports
      operationId: listExportMembers
      summary: Recipients and control group (API export for the provider)
      description: Returns only guests with a contact for the required channel. The provider calls this with the personal token of R-1. The `is_control` parameter separates recipients from the control group.
      x-roles:
        - R-1
      x-uc:
        - UC-5
      parameters:
        - name: is_control
          in: query
          schema:
            type: boolean
        - $ref: ../components/parameters.yaml#/Page
        - $ref: ../components/parameters.yaml#/PageSize
      responses:
        '200':
          description: Export member page
          content:
            application/json:
              schema:
                $ref: ../components/schemas/export-members.yaml#/ExportMemberPage
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
  /api/v1/exports/{id}/download:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    get:
      tags:
        - Exports
      operationId: downloadExport
      summary: Export file, CSV or XLSX by the export format (non-control recipients only)
      description: The control group is not included in the file. The file is XLSX when the export format is `xlsx`, otherwise CSV. If the export is not ready — 409 `export_not_ready`.
      x-roles:
        - R-1
      x-uc:
        - UC-5
      responses:
        '200':
          description: CSV or XLSX file
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="export-{id}.csv" or "export-{id}.xlsx"
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
