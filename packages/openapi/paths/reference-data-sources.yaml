paths:
  /api/v1/data-sources:
    get:
      tags:
        - Reference
      operationId: listDataSources
      summary: Data sources
      description: '`tenantId = null` means a shared management company source (Wi-Fi, parking).'
      x-roles:
        - R-1
        - R-2
        - R-4
      x-uc:
        - UC-17
        - UC-9
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: type_id
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
        - $ref: ../components/parameters.yaml#/Page
        - $ref: ../components/parameters.yaml#/PageSize
      responses:
        '200':
          description: Source page
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-data-sources.yaml#/DataSourcePage
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
    post:
      tags:
        - Reference
      operationId: createDataSource
      summary: Create a tenant source
      description: '`fieldMapping` maps file/API response columns to platform fields (`externalId`, `occurredAt`, `amountMinor`, `phone`, `email`, `card`, `eventType`).'
      x-roles:
        - R-4
      x-uc:
        - UC-17
        - UC-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-data-sources.yaml#/DataSourceCreateRequest
      responses:
        '201':
          description: Source created
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-data-sources.yaml#/DataSource
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '409':
          $ref: ../components/responses.yaml#/Conflict
  /api/v1/data-sources/{id}:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    get:
      tags:
        - Reference
      operationId: getDataSource
      summary: Source details
      x-roles:
        - R-1
        - R-2
        - R-4
      x-uc:
        - UC-17
        - UC-9
      responses:
        '200':
          description: Source
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-data-sources.yaml#/DataSource
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    patch:
      tags:
        - Reference
      operationId: updateDataSource
      summary: Config, field mapping, schedule
      x-roles:
        - R-4
      x-uc:
        - UC-17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-data-sources.yaml#/DataSourceUpdateRequest
      responses:
        '200':
          description: Updated source
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-data-sources.yaml#/DataSource
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    delete:
      tags:
        - Reference
      operationId: deleteDataSource
      summary: Deactivate a source
      description: If the source has imports, it is deactivated (`isActive=false`) and history is preserved. Response 204.
      x-roles:
        - R-4
      x-uc:
        - UC-17
      responses:
        '204':
          $ref: ../components/responses.yaml#/NoContent
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
