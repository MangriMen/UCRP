paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: loginUser
      summary: Sign in with email and password
      description: Verifies the password hash and account activity. The same 401 for a wrong email and a wrong password does not reveal whether the user exists. The access token lives 15 minutes and carries the `sub`, `role`, and `tenantId` claims (for R-3). The refresh token is delivered in an httpOnly cookie.
      security: []
      x-roles:
        - pub
      x-uc:
        - UC-16
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/users.yaml#/LoginRequest
      responses:
        '200':
          description: Successful sign-in
          headers:
            Set-Cookie:
              description: refresh token, httpOnly, Secure, SameSite=Strict, Path=/api/v1/auth
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../components/schemas/users.yaml#/LoginResponse
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '429':
          $ref: ../components/responses.yaml#/TooManyRequests
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: Refresh the access token using the refresh cookie
      description: Reads the refresh token from the httpOnly cookie. An expired or revoked token → 401 and the client returns to the sign-in screen. The SPA performs the refresh single-flight.
      security:
        - cookieAuth: []
      x-roles:
        - pub
      x-uc:
        - UC-16
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: ../components/schemas/users.yaml#/TokenResponse
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logoutUser
      summary: Revoke the refresh token
      description: Revokes the current refresh token and clears the cookie. The access token remains valid until its TTL expires.
      x-roles:
        - any
      x-uc:
        - UC-16
      responses:
        '204':
          $ref: ../components/responses.yaml#/NoContent
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Current user profile, role, and tenantId
      description: Used by the SPA to build the role-based menu. For R-3 it returns `tenantId` from the claims — the only source of the tenant for subsequent checks.
      x-roles:
        - any
      x-uc:
        - UC-16
        - UC-8
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: ../components/schemas/users.yaml#/MeResponse
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
