paths:
  /api/v1/tenant-categories:
    get:
      tags:
        - Reference
      operationId: listTenantCategories
      summary: List tenant categories
      x-roles:
        - R-1
        - R-2
        - R-4
      x-uc:
        - UC-17
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../components/schemas/reference-tenant-categories.yaml#/TenantCategory
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
    post:
      tags:
        - Reference
      operationId: createTenantCategory
      summary: Create a category
      x-roles:
        - R-4
      x-uc:
        - UC-17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-tenant-categories.yaml#/TenantCategoryRequest
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-tenant-categories.yaml#/TenantCategory
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '409':
          $ref: ../components/responses.yaml#/Conflict
  /api/v1/tenant-categories/{id}:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    patch:
      tags:
        - Reference
      operationId: updateTenantCategory
      summary: Update a category
      x-roles:
        - R-4
      x-uc:
        - UC-17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-tenant-categories.yaml#/TenantCategoryRequest
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-tenant-categories.yaml#/TenantCategory
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    delete:
      tags:
        - Reference
      operationId: deleteTenantCategory
      summary: Delete a category
      description: Deletion is not allowed when the category is used by tenants or relations — 409 `category_in_use`.
      x-roles:
        - R-4
      x-uc:
        - UC-17
      responses:
        '204':
          $ref: ../components/responses.yaml#/NoContent
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
  /api/v1/tenant-categories/{id}/relations:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    get:
      tags:
        - Reference
      operationId: getTenantCategoryRelations
      summary: Category adjacency and competition
      description: 'Returns every relation the category takes part in, in both directions. Relations are symmetric, so each entry is given from the side of the path category (`categoryId` is the path id) and a pair stored in both directions is returned once. Used by recommendation scoring: `adjacent` boosts the score, `competitor` lowers it by the competitor penalty (D-34).'
      x-roles:
        - R-1
        - R-2
        - R-4
      x-uc:
        - UC-17
        - UC-15
      responses:
        '200':
          description: Relation set
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-tenant-categories.yaml#/TenantCategoryRelations
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    put:
      tags:
        - Reference
      operationId: replaceTenantCategoryRelations
      summary: Replace the category relation set
      description: 'Replaces every relation the category takes part in, in both directions (idempotent); an empty list removes them all. Each entry must have `categoryId` equal to the path id. Rejected with 400: a self-relation, more than one relation to the same category, an unknown related category, a new relation to an inactive category (an existing one may be kept), `weightPct` outside 0..100.'
      x-roles:
        - R-4
      x-uc:
        - UC-17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-tenant-categories.yaml#/TenantCategoryRelationsReplaceRequest
      responses:
        '200':
          description: New relation set
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-tenant-categories.yaml#/TenantCategoryRelations
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
