paths:
  /api/v1/tenants:
    get:
      tags:
        - Reference
      operationId: listTenants
      summary: List tenants
      description: With an active reference.read grant, R-3 sees only its own tenant, without priority. Other roles get deleted tenants excluded, filters, an exact `meta.total`, period statistics and source counts per tenant.
      x-roles:
        - R-1
        - R-2
        - R-4
        - R-3 (own)
      x-uc:
        - UC-17
        - UC-8
      parameters:
        - $ref: ../components/parameters.yaml#/Page
        - $ref: ../components/parameters.yaml#/PageSize
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: category_id
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: floor
          in: query
          schema:
            type: integer
        - name: period_from
          in: query
          description: Start of the statistics period, inclusive. Without a period the statistics cover all time.
          schema:
            type: string
            format: date
        - name: period_to
          in: query
          description: End of the statistics period, inclusive.
          schema:
            type: string
            format: date
        - name: sort
          in: query
          description: Sort field, prefix `-` for descending. Default `name`. Sorting by a statistic the caller may not read is rejected with 403; suppressed values go last.
          schema:
            type: string
            enum:
              - name
              - -name
              - floor
              - -floor
              - priority
              - -priority
              - createdAt
              - -createdAt
              - guestsCount
              - -guestsCount
              - visitsCount
              - -visitsCount
              - newGuestsCount
              - -newGuestsCount
      responses:
        '200':
          description: Tenant page
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: ../components/schemas/reference-tenants.yaml#/TenantPage
                  - $ref: ../components/schemas/reference-tenants.yaml#/TenantOwnReferencePage
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
    post:
      tags:
        - Reference
      operationId: createTenant
      summary: Create a tenant
      x-roles:
        - R-4
      x-uc:
        - UC-17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-tenants.yaml#/TenantCreateRequest
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-tenants.yaml#/Tenant
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '409':
          $ref: ../components/responses.yaml#/Conflict
  /api/v1/tenants/{id}:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    get:
      tags:
        - Reference
      operationId: getTenant
      summary: Tenant details
      description: With an active reference.read grant, R-3 can read only its own record without priority; a foreign `id` returns 403 `forbidden_tenant`.
      x-roles:
        - R-1
        - R-2
        - R-4
        - R-3 (own)
      x-uc:
        - UC-17
        - UC-8
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: ../components/schemas/reference-tenants.yaml#/Tenant
                  - $ref: ../components/schemas/reference-tenants.yaml#/TenantOwnReference
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    patch:
      tags:
        - Reference
      operationId: updateTenant
      summary: Update a tenant
      description: R-1 may change only the `priority` field (recommendation scoring priority); changing any other field → 403 `forbidden_field`.
      x-roles:
        - R-4
        - R-1 (priority)
      x-uc:
        - UC-17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-tenants.yaml#/TenantUpdateRequest
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-tenants.yaml#/Tenant
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    delete:
      tags:
        - Reference
      operationId: deleteTenant
      summary: Soft-delete a tenant
      description: Deletion is not allowed when the tenant has events — 409 `tenant_has_events`.
      x-roles:
        - R-4
      x-uc:
        - UC-17
      responses:
        '204':
          $ref: ../components/responses.yaml#/NoContent
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
  /api/v1/tenants/{id}/guests:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    get:
      tags:
        - Reference
      operationId: listTenantGuests
      summary: Guests of a tenant
      description: Guests with at least one event at the tenant. Same filters, sorting, masking and permissions as `GET /guests`; `tenant_id` is taken from the path. Item statistics are global, not limited to this tenant.
      x-roles:
        - R-1
        - R-2
        - R-4
      x-uc:
        - UC-2
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: source_id
          in: query
          required: false
          schema:
            type: string
        - name: period_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: period_to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            $ref: ../components/schemas/guests.yaml#/GuestStatus
        - name: has_purchases
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          description: Same values as `GET /guests`; sorting by `totalAmountMinor` without field.guest.total_amount.read is rejected with 403.
          schema:
            type: string
            enum:
              - createdAt
              - -createdAt
              - eventCount
              - -eventCount
              - totalAmountMinor
              - -totalAmountMinor
              - firstSeenAt
              - -firstSeenAt
              - lastSeenAt
              - -lastSeenAt
        - $ref: ../components/parameters.yaml#/Page
        - $ref: ../components/parameters.yaml#/PageSize
      responses:
        '200':
          description: Guest page
          content:
            application/json:
              schema:
                $ref: ../components/schemas/guests.yaml#/GuestPage
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
