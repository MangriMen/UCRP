paths:
  /api/v1/tenants:
    get:
      tags:
        - Reference
      operationId: listTenants
      summary: List tenants
      description: With an active reference.read grant, R-3 sees only its own tenant, without priority. Other roles use the standard reference response.
      x-roles:
        - R-1
        - R-2
        - R-4
        - R-3 (own)
      x-uc:
        - UC-17
        - UC-8
      parameters:
        - $ref: ../components/parameters.yaml#/Page
        - $ref: ../components/parameters.yaml#/PageSize
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: category_id
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Tenant page
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: ../components/schemas/reference-tenants.yaml#/TenantPage
                  - $ref: ../components/schemas/reference-tenants.yaml#/TenantOwnReferencePage
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
    post:
      tags:
        - Reference
      operationId: createTenant
      summary: Create a tenant
      x-roles:
        - R-4
      x-uc:
        - UC-17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-tenants.yaml#/TenantCreateRequest
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-tenants.yaml#/Tenant
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '409':
          $ref: ../components/responses.yaml#/Conflict
  /api/v1/tenants/{id}:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    get:
      tags:
        - Reference
      operationId: getTenant
      summary: Tenant details
      description: With an active reference.read grant, R-3 can read only its own record without priority; a foreign `id` returns 403 `forbidden_tenant`.
      x-roles:
        - R-1
        - R-2
        - R-4
        - R-3 (own)
      x-uc:
        - UC-17
        - UC-8
      responses:
        '200':
          description: Tenant
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: ../components/schemas/reference-tenants.yaml#/Tenant
                  - $ref: ../components/schemas/reference-tenants.yaml#/TenantOwnReference
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    patch:
      tags:
        - Reference
      operationId: updateTenant
      summary: Update a tenant
      description: R-1 may change only the `priority` field (recommendation scoring priority); changing any other field → 403 `forbidden_field`.
      x-roles:
        - R-4
        - R-1 (priority)
      x-uc:
        - UC-17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-tenants.yaml#/TenantUpdateRequest
      responses:
        '200':
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-tenants.yaml#/Tenant
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    delete:
      tags:
        - Reference
      operationId: deleteTenant
      summary: Soft-delete a tenant
      description: Deletion is not allowed when the tenant has events — 409 `tenant_has_events`.
      x-roles:
        - R-4
      x-uc:
        - UC-17
      responses:
        '204':
          $ref: ../components/responses.yaml#/NoContent
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
