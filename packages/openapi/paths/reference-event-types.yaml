paths:
  /api/v1/event-types:
    get:
      tags:
        - Reference
      operationId: listEventTypes
      summary: Event types
      description: '`countsAsPresence=true` means the event participates in visit counting and cross-tenant rate.'
      x-roles:
        - R-1
        - R-2
        - R-4
      x-uc:
        - UC-17
      responses:
        '200':
          description: Event types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../components/schemas/reference-event-types.yaml#/EventType
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
    post:
      tags:
        - Reference
      operationId: createEventType
      summary: New event type
      x-roles:
        - R-4
      x-uc:
        - UC-17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-event-types.yaml#/EventTypeRequest
      responses:
        '201':
          description: Event type created
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-event-types.yaml#/EventType
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '409':
          $ref: ../components/responses.yaml#/Conflict
  /api/v1/event-types/{id}:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    patch:
      tags:
        - Reference
      operationId: updateEventType
      summary: Update or deactivate an event type
      x-roles:
        - R-4
      x-uc:
        - UC-17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/reference-event-types.yaml#/EventTypeRequest
      responses:
        '200':
          description: Updated event type
          content:
            application/json:
              schema:
                $ref: ../components/schemas/reference-event-types.yaml#/EventType
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    delete:
      tags:
        - Reference
      operationId: deleteEventType
      summary: Delete an event type
      description: Deletion is not allowed when events use the type — 409 `event_type_in_use`; deactivate it instead.
      x-roles:
        - R-4
      x-uc:
        - UC-17
      responses:
        '204':
          $ref: ../components/responses.yaml#/NoContent
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
