paths:
  /api/v1/guests/{id}/merge:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    post:
      tags:
        - Identity
      operationId: mergeGuests
      summary: Manual profile merge
      description: Merges guest `{id}` into `targetGuestId`. Merging with itself → 400; a blocked pair → 409 `merge_blocked` (remove the block via `DELETE /merge-blocks/{id}`).
      x-roles:
        - R-4
      x-uc:
        - UC-11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/MergeRequest
      responses:
        '200':
          description: Merge result
          content:
            application/json:
              schema:
                $ref: ../components/schemas/identity.yaml#/MergeResult
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
  /api/v1/merge-blocks:
    get:
      tags:
        - Identity
      operationId: listMergeBlocks
      summary: List merge blocks
      x-roles:
        - R-4
      x-uc:
        - UC-11
      parameters:
        - $ref: ../components/parameters.yaml#/Page
        - $ref: ../components/parameters.yaml#/PageSize
      responses:
        '200':
          description: Merge block page
          content:
            application/json:
              schema:
                $ref: ../components/schemas/identity.yaml#/MergeBlockPage
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
  /api/v1/merge-blocks/{id}:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    delete:
      tags:
        - Identity
      operationId: deleteMergeBlock
      summary: Remove a merge block
      description: Once removed, the pair can be merged automatically again when a shared reliable key appears.
      x-roles:
        - R-4
      x-uc:
        - UC-11
      responses:
        '204':
          $ref: ../components/responses.yaml#/NoContent
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
