paths:
  /api/v1/campaigns:
    get:
      tags:
        - Campaigns
      operationId: listCampaigns
      summary: List campaigns
      x-roles:
        - R-1
        - R-2
        - R-4
      x-uc:
        - UC-20
      parameters:
        - name: status
          in: query
          schema:
            $ref: ../components/schemas/campaigns.yaml#/CampaignStatus
        - name: segment_id
          in: query
          schema:
            type: string
        - $ref: ../components/parameters.yaml#/Page
        - $ref: ../components/parameters.yaml#/PageSize
      responses:
        '200':
          description: Campaign page
          content:
            application/json:
              schema:
                $ref: ../components/schemas/campaigns.yaml#/CampaignPage
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
    post:
      tags:
        - Campaigns
      operationId: createCampaign
      summary: Create a campaign
      description: Sets the target tenant, segment, and attribution window (14 days by default).
      x-roles:
        - R-1
      x-uc:
        - UC-20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/campaigns.yaml#/CampaignCreateRequest
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: ../components/schemas/campaigns.yaml#/Campaign
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
  /api/v1/campaigns/{id}:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    get:
      tags:
        - Campaigns
      operationId: getCampaign
      summary: Campaign details
      x-roles:
        - R-1
        - R-2
        - R-4
      x-uc:
        - UC-20
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema:
                $ref: ../components/schemas/campaigns.yaml#/Campaign
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    patch:
      tags:
        - Campaigns
      operationId: updateCampaign
      summary: Update a campaign
      description: Changing the segment or target tenant after the first export is not allowed — 409 `campaign_locked`.
      x-roles:
        - R-1
      x-uc:
        - UC-20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/campaigns.yaml#/CampaignUpdateRequest
      responses:
        '200':
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: ../components/schemas/campaigns.yaml#/Campaign
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
    delete:
      tags:
        - Campaigns
      operationId: deleteCampaign
      summary: Delete a campaign
      description: Deletion is not allowed when the campaign has exports — 409 `campaign_has_exports`.
      x-roles:
        - R-1
      x-uc:
        - UC-20
      responses:
        '204':
          $ref: ../components/responses.yaml#/NoContent
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
  /api/v1/campaigns/{id}/results:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    get:
      tags:
        - Campaigns
      operationId: getCampaignResults
      summary: Visit conversion and lift versus the control group
      description: Conversion is the share of recipients (`contact_log`) with at least one `countsAsPresence` event at the campaign target tenant within `(contactedAt, contactedAt + attributionDays]`. Lift is the difference between recipient and control group conversion; significance is a two-sample test of proportions. The control group baseline is measured from `export.createdAt`, because control members are not written to `contact_log`.
      x-roles:
        - R-1
        - R-2
      x-uc:
        - UC-20
      responses:
        '200':
          description: Campaign results
          content:
            application/json:
              schema:
                $ref: ../components/schemas/campaigns.yaml#/CampaignResults
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
