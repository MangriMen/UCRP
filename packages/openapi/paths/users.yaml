paths:
  /api/v1/users:
    get:
      tags:
        - Users
      operationId: listUsers
      summary: List users
      x-roles:
        - R-2
      x-uc:
        - UC-18
      parameters:
        - $ref: ../components/parameters.yaml#/Page
        - $ref: ../components/parameters.yaml#/PageSize
        - name: role
          in: query
          schema:
            $ref: ../components/schemas/common.yaml#/UserRole
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          description: Search by email or name
          schema:
            type: string
            maxLength: 200
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: ../components/schemas/users.yaml#/UserPage
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
    post:
      tags:
        - Users
      operationId: createUser
      summary: Direct account creation is disabled
      description: Direct password assignment is disabled. Use the employee invitation flow when delivery is configured.
      x-roles:
        - R-2
      x-uc:
        - UC-18
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/users.yaml#/UserCreateRequest
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ../components/schemas/users.yaml#/User
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '409':
          $ref: ../components/responses.yaml#/Conflict
  /api/v1/users/{id}:
    parameters:
      - $ref: ../components/parameters.yaml#/IdPath
    get:
      tags:
        - Users
      operationId: getUser
      summary: User details
      x-roles:
        - R-2
      x-uc:
        - UC-18
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: ../components/schemas/users.yaml#/User
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    patch:
      tags:
        - Users
      operationId: updateUser
      summary: Update a user's display name
      description: Role, tenant, activity and password changes are disabled until a verified account-management flow is available.
      x-roles:
        - R-2
      x-uc:
        - UC-18
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/users.yaml#/UserUpdateRequest
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: ../components/schemas/users.yaml#/User
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
    delete:
      tags:
        - Users
      operationId: deactivateUser
      summary: Deactivate a user (soft)
      description: 'No hard delete: `isActive=false` and refresh tokens are revoked. The last active R-2 cannot be deactivated — 409.'
      x-roles:
        - R-2
      x-uc:
        - UC-18
      responses:
        '204':
          $ref: ../components/responses.yaml#/NoContent
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '404':
          $ref: ../components/responses.yaml#/NotFound
        '409':
          $ref: ../components/responses.yaml#/Conflict
