paths:
  /api/v1/users/invitations:
    post:
      tags:
        - Users
      operationId: createUserInvitation
      summary: Invite an employee
      description: The one-time token is delivered directly to the employee and never returned in the response. Until a delivery provider is configured, the endpoint returns 503 and creates no invitation.
      x-roles:
        - R-2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - displayName
                - role
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                role:
                  type: string
                  enum:
                    - manager
                    - tenant
                tenantId:
                  type: string
      responses:
        '202':
          description: Invitation sent
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/Forbidden
        '503':
          description: Invitation delivery is unavailable
  /api/v1/auth/invitations/accept:
    post:
      tags:
        - Auth
      operationId: acceptUserInvitation
      summary: Accept an invitation and choose a password
      description: Tokens expire after 24 hours, are single-use and become invalid after a policy change. Account recovery is not supported by this endpoint.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  format: password
      responses:
        '204':
          description: Account created
        '400':
          $ref: ../components/responses.yaml#/BadRequest
        '401':
          $ref: ../components/responses.yaml#/Unauthorized
        '503':
          description: Invitation delivery is unavailable
