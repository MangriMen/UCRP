name: ucrp

x-environment: &environment
  UCRP_HTTP_ADDR: ':8080'
  UCRP_DATABASE_URL: 'postgres://${POSTGRES_USER:-ucrp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ucrp}?sslmode=disable'
  UCRP_JWT_SECRET: '${UCRP_JWT_SECRET}'
  UCRP_UPLOAD_DIR: /data/uploads
  UCRP_LOG_LEVEL: '${UCRP_LOG_LEVEL:-info}'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-ucrp}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB:-ucrp}'
    volumes:
      - ucrp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ucrp} -d ${POSTGRES_DB:-ucrp}']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/mangrimen/ucrp/ucrp-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *environment
    volumes:
      - ucrp_data:/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: ghcr.io/mangrimen/ucrp/ucrp-worker:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *environment
    volumes:
      - ucrp_data:/data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  web:
    image: ghcr.io/mangrimen/ucrp/ucrp-web:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - api

volumes:
  ucrp_pg:
  ucrp_data:
