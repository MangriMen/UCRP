services:
  db:
    ports:
      - '${POSTGRES_PORT:-5543}:5432'

  api:
    image: ucrp-api:local
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
      args:
        APP: api
    ports:
      - '${UCRP_HTTP_PORT:-8080}:8080'

  worker:
    image: ucrp-worker:local
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
      args:
        APP: worker

  web:
    image: ucrp-web:local
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    ports:
      - '${UCRP_WEB_PORT:-8081}:80'
