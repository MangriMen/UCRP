pre-commit:
  parallel: true

  jobs:
    - name: go:fmt
      root: 'apps/api/'
      glob: '**/*.go'
      run: gofmt -l -w {staged_files}
      stage_fixed: true

    - name: go:vet
      root: 'apps/api/'
      glob: '**/*.go'
      run: go vet ./...

    - name: fmt
      glob: '**/*.{js,jsx,ts,tsx,json,jsonc,css,md,yml,yaml}'
      run: bun x oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: js:lint
      glob: '**/*.{js,jsx,ts,tsx,json,jsonc,css}'
      run: bun run lint

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' \
          || { echo "Сообщение коммита должно соответствовать Conventional Commits"; exit 1; }
