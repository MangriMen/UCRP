pre-commit:
  parallel: true

  jobs:
    - name: go:fmt
      root: "apps/api/"
      glob: "**/*.go"
      run: gofmt -l -w {staged_files}
      stage_fixed: true

    - name: go:vet
      root: "apps/api/"
      glob: "**/*.go"
      run: go vet ./...

    - name: go:lint
      root: "apps/api/"
      glob: "**/*.go"
      run: |
        version=2.15.0
        if ! golangci-lint version 2>/dev/null | grep -q 'version '$version; then
          echo 'golangci-lint v'$version' not found. Install: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v'$version
          exit 1
        fi
        golangci-lint run ./...

    - name: fmt
      glob: "**/*.{js,jsx,ts,tsx,json,jsonc,css,md,yml,yaml}"
      run: bun x oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: js:lint
      glob: "**/*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: bun run lint

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' || { echo 'Commit message must follow Conventional Commits'; exit 1; }

    - name: commit-message-language
      run: |
        if head -1 {1} | LC_ALL=C grep -q '[^ -~]'; then
          echo 'Commit message must be written in English (ASCII only)'
          exit 1
        fi
