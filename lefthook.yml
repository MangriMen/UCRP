pre-commit:
  parallel: true

  jobs:
    - name: go:fmt
      glob: '{apps/api/**/*.go,apps/api/go.mod,apps/api/go.sum,.golangci.yml,scripts/go-check.sh}'
      run: scripts/run-on-tree.sh index scripts/go-check.sh fmt

    - name: go:vet
      glob: '{apps/api/**/*.go,apps/api/go.mod,apps/api/go.sum,.golangci.yml,scripts/go-check.sh}'
      run: scripts/run-on-tree.sh index scripts/go-check.sh vet

    - name: go:lint
      glob: '{apps/api/**/*.go,apps/api/go.mod,apps/api/go.sum,.golangci.yml,scripts/go-check.sh}'
      run: scripts/run-on-tree.sh index scripts/go-check.sh lint

    - name: fmt
      glob: '**/*.{js,jsx,ts,tsx,json,jsonc,css,md,yml,yaml}'
      run: scripts/run-on-tree.sh index bun x oxfmt --check --no-error-on-unmatched-pattern {staged_files}

    - name: js:lint
      glob: '**/*.{js,jsx,ts,tsx,json,jsonc,css}'
      run: scripts/run-on-tree.sh index bun run lint

pre-push:
  jobs:
    - name: go:test
      glob: '{apps/api/**/*.go,apps/api/go.mod,apps/api/go.sum,.golangci.yml,scripts/go-check.sh}'
      run: scripts/run-on-tree.sh head scripts/go-check.sh test

    - name: go:build
      glob: '{apps/api/**/*.go,apps/api/go.mod,apps/api/go.sum,.golangci.yml,scripts/go-check.sh}'
      run: scripts/run-on-tree.sh head scripts/go-check.sh build

    - name: web:test
      glob: '{apps/web/**,packages/**,docs/openapi.json,docs/openapi/**,package.json,bun.lock,turbo.jsonc,tsconfig.base.json}'
      run: scripts/run-on-tree.sh head bun run test

    - name: web:build
      glob: '{apps/web/**,packages/**,docs/openapi.json,docs/openapi/**,package.json,bun.lock,turbo.jsonc,tsconfig.base.json}'
      run: scripts/run-on-tree.sh head bun run build

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+' || { echo 'Commit message must follow Conventional Commits'; exit 1; }

    - name: commit-message-language
      run: |
        if head -1 {1} | LC_ALL=C grep -q '[^ -~]'; then
          echo 'Commit message must be written in English (ASCII only)'
          exit 1
        fi
