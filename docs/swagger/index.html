<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UCRP API — Swagger UI</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="stylesheet" href="./swagger-ui.css" />
    <style>
      html {
        box-sizing: border-box;
        overflow-y: scroll;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: #fafafa;
      }
      .topbar {
        display: none;
      }
      .swagger-ui .info .title small.version-stamp {
        background-color: #3b4151;
      }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <script src="./swagger-ui-bundle.js" crossorigin></script>
    <script src="./swagger-ui-standalone-preset.js" crossorigin></script>
    <script>
      window.onload = () => {
        window.ui = SwaggerUIBundle({
          url: './openapi.json',
          dom_id: '#swagger-ui',
          deepLinking: true,
          docExpansion: 'none',
          defaultModelsExpandDepth: 1,
          defaultModelExpandDepth: 2,
          displayOperationId: true,
          displayRequestDuration: true,
          filter: true,
          persistAuthorization: true,
          showExtensions: true,
          showCommonExtensions: true,
          tryItOutEnabled: true,
          tagsSorter: 'alpha',
          operationsSorter: 'alpha',
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: 'StandaloneLayout',
          oauth2RedirectUrl: `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, '')}oauth2-redirect.html`,
          requestInterceptor: (req) => {
            // request_id for end-to-end tracing (see 15-consistency.md)
            if (!req.headers['X-Request-Id']) {
              req.headers['X-Request-Id'] = crypto.randomUUID();
            }
            return req;
          },
        });
      };
    </script>
  </body>
</html>
