name: ucrp-api

x-build: &build
  context: .
  dockerfile: docker/Dockerfile

x-environment: &environment
  UCRP_HTTP_ADDR: ':8080'
  UCRP_DATABASE_URL: 'postgres://${POSTGRES_USER:-ucrp}:${POSTGRES_PASSWORD:-ucrp}@db:5432/${POSTGRES_DB:-ucrp}?sslmode=disable'
  UCRP_JWT_SECRET: ${UCRP_JWT_SECRET:-dev-secret-change-me}
  UCRP_UPLOAD_DIR: /data/uploads
  UCRP_LOG_LEVEL: ${UCRP_LOG_LEVEL:-info}
  UCRP_ADMIN_EMAIL: ${UCRP_ADMIN_EMAIL:-admin@ucrp.local}
  UCRP_ADMIN_PASSWORD: ${UCRP_ADMIN_PASSWORD:-admin12345}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ucrp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucrp}
      POSTGRES_DB: ${POSTGRES_DB:-ucrp}
    ports:
      - '${POSTGRES_PORT:-5543}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ucrp} -d ${POSTGRES_DB:-ucrp}']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      <<: *build
      args:
        APP: api
    image: ucrp-api:local
    restart: unless-stopped
    environment:
      <<: *environment
    ports:
      - '${UCRP_HTTP_PORT:-8080}:8080'
    volumes:
      - api-data:/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      <<: *build
      args:
        APP: worker
    image: ucrp-worker:local
    restart: unless-stopped
    environment:
      <<: *environment
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - api-data:/data

volumes:
  pg-data:
  api-data:
