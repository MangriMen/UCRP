# UCRP backend — docker compose (api + worker).
#
#   cd apps/api && docker compose -f docker/docker-compose.yml up --build
#
# SQLite на старте: named volume api-data (/data → db + uploads).
# PostgreSQL позже: смена UCRP_DATABASE_URL и драйвера в sqlstore (D-8, план миграций).

name: ucrp-api

x-build: &build
  context: ..
  dockerfile: docker/Dockerfile

x-environment: &environment
  UCRP_HTTP_ADDR: ':8080'
  UCRP_DATABASE_URL: 'sqlite:///data/ucrp.db'
  UCRP_JWT_SECRET: ${UCRP_JWT_SECRET:-dev-secret-change-me}
  UCRP_UPLOAD_DIR: /data/uploads
  UCRP_LOG_LEVEL: ${UCRP_LOG_LEVEL:-info}

services:
  api:
    build:
      <<: *build
      args:
        APP: api
    image: ucrp-api:local
    restart: unless-stopped
    environment:
      <<: *environment
    ports:
      - '${UCRP_HTTP_PORT:-8080}:8080'
    volumes:
      - api-data:/data

  worker:
    build:
      <<: *build
      args:
        APP: worker
    image: ucrp-worker:local
    restart: unless-stopped
    environment:
      <<: *environment
    depends_on:
      - api
    volumes:
      - api-data:/data

volumes:
  api-data:
